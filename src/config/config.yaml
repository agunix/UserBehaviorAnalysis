# UBA configuration file
# Override for Environment variable: UBA_<SECTION>__<KEY>
# For example: UBA_PARSER__MODE=live

environment: development

parser:
  mode: offline              # "offline" (from EVTX files) or "live" (real-TIME Windows API)
  channels:
    - "Security"
    - "Microsoft-Windows-Sysmon/Operational"
  poll_interval_seconds: 5
  evtx_input_dir: "data/evtx"
  parsed_output_dir: "data/parsed"
  linux_rule_groups:
    - "sshd"
    - "pam"
    - "authentication_success"
    - "authentication_failed"
    - "audit_command"
    - "audit"
    - "syscheck"

logging:
  level: INFO
  log_file: "logs/uba.log"
  max_bytes: 10485760
  backup_count: 5

wazuh_indexer:
  host: "127.0.0.1"       # Wazuh Indexer/manager IP
  port: 9200
  username: "admin"
  password: ""            # DO NOT WRITE PASSWORD HERE! export UBA_WAZUH_INDEXER__PASSWORD=... use
  verify_ssl: false        # false for test with self-signed certificate, true in production
  index_pattern: "wazuh-alerts-*"

wazuh_alert_output:
  output_file: "data/uba_alerts/uba_events.json"

risk:
  rule_weight: 0.6
  ml_weight: 0.4
  low_threshold: 30
  medium_threshold: 60
  high_threshold: 85

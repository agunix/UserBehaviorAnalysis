# AI-UBA konfiqurasiya faylı
# Environment variable ilə override etmək üçün: AIUBA_<SECTION>__<KEY>
# Məsələn: AIUBA_PARSER__MODE=live

environment: development

parser:
  mode: offline              # "offline" (EVTX fayllarından) və ya "live" (real-vaxt Windows API)
  channels:
    - "Security"
    - "Microsoft-Windows-Sysmon/Operational"
  poll_interval_seconds: 5
  evtx_input_dir: "data/evtx"
  parsed_output_dir: "data/parsed"
  linux_rule_groups:
    - "sshd"
    - "pam"
    - "authentication_success"
    - "authentication_failed"
    - "audit_command"
    - "audit"
    - "syscheck"

logging:
  level: INFO
  log_file: "logs/aiuba.log"
  max_bytes: 10485760
  backup_count: 5

wazuh_indexer:
  host: "127.0.0.1"       # Wazuh Indexer/manager IP-si
  port: 9200
  username: "admin"
  password: ""            # BURAYA YAZMA! export AIUBA_WAZUH_INDEXER__PASSWORD=... istifadə et
  verify_ssl: false        # self-signed sertifikatla test üçün false, production-da true
  index_pattern: "wazuh-alerts-*"

wazuh_alert_output:
  output_file: "data/aiuba_alerts/aiuba_events.json"

risk:
  rule_weight: 0.6
  ml_weight: 0.4
  low_threshold: 30
  medium_threshold: 60
  high_threshold: 85

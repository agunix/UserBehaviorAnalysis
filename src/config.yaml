
# UBA configuration files
# For override environment variables: UBA_<SECTION>__<KEY>
# For example: UBA_PARSER__MODE=live


environment: development

parser:

  mode: offline              # "offline" (EVTX files) or "live" (real-time Windows API)

  channels:
    - "Security"
    - "Microsoft-Windows-Sysmon/Operational"
  poll_interval_seconds: 5
  evtx_input_dir: "data/evtx"
  parsed_output_dir: "data/parsed"

logging:
  level: INFO
  log_file: "logs/aiuba.log"
  max_bytes: 10485760
  backup_count: 5

wazuh_indexer:

  host: ${WAZUH_HOST}       
  port: 9200
  username: ${WAZUH_USERNAME}
  password: ${WAZUH_PASSWORD}
  verify_ssl: false       

  index_pattern: "wazuh-alerts-*"

wazuh_alert_output:
  output_file: "data/aiuba_alerts/aiuba_events.json"

risk:
  rule_weight: 0.6
  ml_weight: 0.4
  low_threshold: 30
  medium_threshold: 60
  high_threshold: 85
